[workspace]
members = [
    "core",
    "rf-layer",
    "tracking",
    "hardware",
    "scheduler",
    "bitemporal",
    "regulatory",
    "federation",
    "agent",
    "deployment",
    "caching",
    "batching",
    "snapshotting",
    "sdr-sim",
    "policy-compiler",
    "oisl",
    "optical",
    "uplink",
    "acs",
    "rf-front-end",
    "digital-twin",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.82"
authors = ["Ground Core Team"]
license = "Apache-2.0"
repository = "https://github.com/ground-core/core"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1.83"
futures = "0.3.31"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "2.0"

# Cryptography
ed25519-dalek = "1.0"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1.0", features = ["serde", "v4", "v5"] }
hex = "0.4"

# Time and scheduling
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# Math and signal processing
nalgebra = { version = "0.32", features = ["serde-serialize"] }
rustfft = "6.2"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Testing
proptest = "1.4"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Database (optional for future use)
# sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json"] }

# Web framework (optional for future use)
# axum = "0.8"
# tower = "0.5"
# hyper = "1.5"

# Satellite tracking
sgp4 = { version = "2.4", features = ["serde"] }

# Memory safety (for real-time layer)
bumpalo = "3.16"

# ECS engine for digital twin simulation
bevy_ecs = "0.14"


[workspace.metadata.release]
allow-branch = ["main"]
