[package]
name = "uplink"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core types
ground_core = { path = "../core" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1.83"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "2.0"

# Cryptography
aes-gcm = "0.10"
sha2 = "0.10"
ed25519-dalek = "1.0"
rand = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# UUID
uuid = { version = "1.0", features = ["serde", "v4"] }

# Priority queue
priority-queue = "1.3"
