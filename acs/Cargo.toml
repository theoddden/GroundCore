[package]
name = "acs"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core types
ground_core = { path = "../core" }
tracking = { path = "../tracking" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1.83"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Math
nalgebra = { version = "0.32", features = ["serde-serialize"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# UUID
uuid = { version = "1.0", features = ["serde", "v4"] }
