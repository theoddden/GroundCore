[package]
name = "rf-front-end"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core types
ground_core = { path = "../core", package = "ground-core" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1.83"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# UUID
uuid = { version = "1.0", features = ["serde", "v4"] }
